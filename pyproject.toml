[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtts_demo_helper"
version = "1.0.0"
description = "Offline mutual-TLS MQTT broker demonstration and test helpers"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Avnet" },
    { name = "Laurent Lagosanto", email = "laurent.lagosanto@avnet.eu" },
]
dependencies = [
    "amqtt",
    "paho-mqtt",
    "cryptography",
    "colorama",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[project.scripts]
demo-mqtt-broker = "demo_mqtt_broker:main"
demo-mqtt-test-client = "examples.device_simulator:main"
demo-mqtt-create-device-certificate = "examples.create_device_certificate:main"

[project.urls]
License = "https://www.apache.org/licenses/LICENSE-2.0"

[tool.setuptools]
packages = ["mqtt_demo", "examples"]
py-modules = ["demo_mqtt_broker"]
